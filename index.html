<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1120"><title>3D Vision · H.E.R.B.I.E.</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0a1120;color:#eef5fc}header{padding:16px 18px;border-bottom:1px solid #263851;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}h1{font-size:21px;margin:0}header p{margin:4px 0 0;color:#a3b7cc;font-size:12px}.controls{display:flex;gap:7px;flex-wrap:wrap}button,select{border:1px solid #406180;background:#1c304a;color:#f5faff;padding:10px;border-radius:9px;font-size:14px}button[aria-pressed=true]{background:#1475b2;border-color:#54b3e5}button:focus-visible{outline:2px solid #9fe0ff}.viewer{position:relative}#v{height:calc(100dvh - 215px);min-height:350px;touch-action:none}#tag{position:absolute;top:12px;left:12px;padding:7px 10px;background:#152438d9;border:1px solid #47617c;border-radius:7px;font-size:12px;color:#c9deee;pointer-events:none}footer{padding:10px 16px 15px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#aebfd0}footer a{color:#8ed5ff}.warn{color:#f7d596}aside{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid #263851}aside label{font-size:13px;color:#acbfd1}</style></head><body>
<header><div><h1>3D Vision <span style="color:#7dc9fb">/ H.E.R.B.I.E.</span></h1><p>Interactive engineering concept viewer · V1 skeleton-first</p></div><div class="controls"><button id="assemble" aria-pressed="true">Assembled</button><button id="explode" aria-pressed="false">Exploded</button><button id="fit">Reset view</button></div></header>
<div class="viewer"><div id="v"></div><div id="tag">Loading viewer…</div></div>
<aside><label for="model">Model:</label><select id="model"><option value="concept">Built-in concept (approximate)</option><option value="glb">Original CAD GLB (when hosted)</option></select><label for="part">Part:</label><select id="part"><option value="">Complete robot</option><option value="001">HBR-001</option><option value="002">HBR-002</option><option value="003">HBR-003</option><option value="004">HBR-004</option><option value="005">HBR-005</option><option value="006">HBR-006</option><option value="007">HBR-007</option><option value="008">HBR-008</option><option value="009">HBR-009</option><option value="010">HBR-010</option><option value="011">HBR-011</option><option value="012">HBR-012</option><option value="013">HBR-013</option><option value="014">HBR-014</option><option value="015">HBR-015</option><option value="016">HBR-016</option><option value="017">HBR-017</option><option value="018">HBR-018</option></select><button id="wire" aria-pressed="false">Wireframe</button><button id="grid" aria-pressed="true">Grid</button></aside>
<footer><div id="status">Preparing preview…</div><div>Drag to rotate · Pinch to zoom · Two fingers to pan · <a href="https://github.com/jimedusot-beep/3D-vision/tree/main/HERBIE_V1" target="_blank" rel="noopener">All source files</a> · <a href="https://github.com/jimedusot-beep/3D-vision" target="_blank" rel="noopener">GitHub</a></div></footer>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import {STLLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/STLLoader.js';
const el=document.getElementById('v'),tag=document.getElementById('tag'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color('#0a1120');const camera=new THREE.PerspectiveCamera(42,1,1,12000);camera.position.set(630,450,780);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;el.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd7f0ff,0x26405b,2.5));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(430,650,520);scene.add(key);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const grid=new THREE.GridHelper(700,14,0x3b648a,0x233850);grid.position.y=-60;scene.add(grid);
let active=null,exploded=false,wire=false,mode='concept';
const mat=(c,roughness=.5)=>new THREE.MeshStandardMaterial({color:c,roughness,metalness:.14});const white=mat('#d9eaf5'),steel=mat('#6d879e'),blue=mat('#54baf2'),glass=mat('#0b1e33',.24),tray=mat('#328ab6');
function add(g,geo,m,p=[0,0,0]){const o=new THREE.Mesh(geo,m);o.position.set(...p);g.add(o);return o}
function box(g,w,h,d,m,p){return add(g,new THREE.BoxGeometry(w,h,d),m,p)}
function sphere(g,w,h,d,m,p){const o=add(g,new THREE.SphereGeometry(1,32,20),m,p);o.scale.set(w,h,d);return o}
function makeConcept(){const root=new THREE.Group();const groups=[];function part(id,pos){const g=new THREE.Group();g.name=id;g.userData.home=new THREE.Vector3(...pos);root.add(g);g.position.set(...pos);groups.push(g);return g}
let g=part('Stationary base',[0,-45,0]);box(g,280,32,240,steel,[0,0,0]);box(g,190,8,150,white,[0,19,0]);
g=part('Left rail',[-82,105,0]);box(g,12,205,15,steel,[0,0,0]);g=part('Right rail',[82,105,0]);box(g,12,205,15,steel,[0,0,0]);g=part('Upper frame',[0,208,0]);box(g,170,12,150,steel,[0,0,0]);g=part('Lower frame',[0,0,0]);box(g,170,12,150,steel,[0,0,0]);
g=part('Compute tray',[0,120,15]);box(g,140,6,115,tray,[0,0,0]);g=part('Power tray',[0,52,15]);box(g,120,6,92,blue,[0,0,0]);
g=part('Front torso shell',[0,104,91]);box(g,210,198,11,white,[0,0,0]);g=part('Back torso shell',[0,104,-91]);box(g,210,198,11,white,[0,0,0]);
g=part('Neck',[0,227,0]);box(g,75,35,75,steel,[0,0,0]);g=part('Head shell',[0,328,0]);sphere(g,120,73,85,white,[0,0,0]);g=part('Faceplate',[0,329,80]);sphere(g,100,49,12,glass,[0,0,0]);sphere(g,17,22,3,blue,[-47,3,10]);sphere(g,17,22,3,blue,[47,3,10]);
g=part('Left shoulder',[-120,140,0]);sphere(g,22,22,22,steel,[0,0,0]);g=part('Right shoulder',[120,140,0]);sphere(g,22,22,22,steel,[0,0,0]);g=part('Left static arm',[-158,76,0]);sphere(g,24,78,26,white,[0,0,0]);g=part('Right static arm',[158,76,0]);sphere(g,24,78,26,white,[0,0,0]);
root.userData.parts=groups;root.name='Illustrative geometry, not original CAD';return root}
function spread(value){if(!active)return;if(mode==='concept'){for(const p of active.userData.parts){let h=p.userData.home;let offset=new THREE.Vector3(Math.sign(h.x)*Math.min(70,Math.abs(h.x)*.36),h.y>260?85:h.y>200?30:h.y<0?-45:0,h.z>70?95:h.z< -70?-95:0);p.position.copy(h).addScaledVector(offset,value?1:0)}}else{status.textContent='Original GLB view loaded; choose separate assembled/exploded model with buttons';}}
function fit(){if(!active)return;const b=new THREE.Box3().setFromObject(active),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3());controls.target.copy(c);const k=Math.max(s.x,s.y,s.z,250);camera.position.copy(c).add(new THREE.Vector3(k*1.45,k*.95,k*1.7));camera.near=Math.max(.01,k/2000);camera.far=k*80;camera.updateProjectionMatrix();controls.update()}
function swap(node){if(active)scene.remove(active);active=node;scene.add(node);fit();if(wire)active.traverse(o=>{if(o.isMesh)o.material=o.material.clone(),o.material.wireframe=true})}
async function loadGlb(){const file=exploded?'HERBIE_V1_Exploded_Interactive.glb':'HERBIE_V1_Assembled_Interactive.glb';tag.textContent='Original CAD GLB · '+(exploded?'exploded':'assembled');status.textContent='Loading original CAD GLB…';new GLTFLoader().load('models/'+file,r=>{swap(r.scene);status.textContent='Original GLB loaded — prototype geometry, not fit validated'},undefined,()=>{tag.textContent='Original GLB not hosted yet';status.textContent='GLB asset is not published; showing built-in 3D concept instead.';mode='concept';document.getElementById('model').value='concept';swap(makeConcept());spread(exploded)})}
function update(){if(document.getElementById('part').value){loadPart(document.getElementById('part').value);return}document.getElementById('assemble').setAttribute('aria-pressed',String(!exploded));document.getElementById('explode').setAttribute('aria-pressed',String(exploded));if(mode==='glb')loadGlb();else{spread(exploded);fit();tag.textContent='Illustrative concept · '+(exploded?'exploded':'assembled');status.textContent='Built-in schematic; NOT the original STL geometry'}}
function loadPart(id){tag.textContent='Part HBR-'+id+' · prototype STL';status.textContent='Loading individual STL…';new STLLoader().load('HERBIE_V1/STL/HBR-'+id+'.stl',geometry=>{geometry.computeVertexNormals();let material=new THREE.MeshStandardMaterial({color:0x80cbf8,side:THREE.DoubleSide,metalness:.15,roughness:.64,wireframe:wire});let group=new THREE.Group();group.add(new THREE.Mesh(geometry,material));swap(group);status.textContent='Viewing HBR-'+id+' — mesh only, no fit certification'},undefined,()=>{status.textContent='STL not available in published site'})}
document.getElementById('part').onchange=e=>{if(e.target.value)loadPart(e.target.value);else if(mode==='glb')loadGlb();else {swap(makeConcept());update()}};
document.getElementById('assemble').onclick=()=>{exploded=false;update()};document.getElementById('explode').onclick=()=>{exploded=true;update()};document.getElementById('fit').onclick=fit;document.getElementById('model').onchange=e=>{document.getElementById('part').value='';mode=e.target.value;if(mode==='glb')loadGlb();else{swap(makeConcept());update()}};document.getElementById('wire').onclick=()=>{wire=!wire;document.getElementById('wire').setAttribute('aria-pressed',String(wire));if(active)active.traverse(o=>{if(o.isMesh)o.material=o.material.clone(),o.material.wireframe=wire})};document.getElementById('grid').onclick=()=>{grid.visible=!grid.visible;document.getElementById('grid').setAttribute('aria-pressed',String(grid.visible))};function resize(){renderer.setSize(el.clientWidth,el.clientHeight);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(el);function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();swap(makeConcept());update();
</script></body></html>
