<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Conditional three-cell red LED transmitter wiring</title><desc id="desc">Verified battery positive connects through a 330 ohm series resistor to the LED anode. LED cathode connects back to battery negative. Example supply 4.5 volts; all actual ratings require checking.</desc>
<rect width="800" height="400" rx="18" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#17263c"><text x="30" y="40" font-size="24" font-weight="bold">Red LED transmitter · example wiring</text><text x="30" y="68" font-size="16">Power OFF while connecting. One LED; one resistor in series.</text>
<rect x="38" y="132" width="178" height="158" rx="12" fill="#dde8f4" stroke="#17263c" stroke-width="2"/><text x="55" y="166" font-size="19" font-weight="bold">Verified holder</text><text x="55" y="194" font-size="17">3 × 1.5 V alkaline</text><text x="55" y="221" font-size="17">Example: ≈ 4.5 V</text><text x="55" y="252" font-size="15">Cell size / wiring:</text><text x="55" y="274" font-size="15">measure first</text>
<path d="M216 155 H320 M440 155 H578" fill="none" stroke="#be123c" stroke-width="5"/>
<rect x="320" y="138" width="120" height="34" fill="#fff1cc" stroke="#17263c" stroke-width="2"/><text x="344" y="161" font-size="20">330 Ω</text><text x="310" y="116" font-size="17">Series resistor</text><text x="239" y="143" font-size="22" fill="#be123c">+</text>
<circle cx="615" cy="155" r="37" fill="#ffe4e6" stroke="#be123c" stroke-width="3"/><text x="590" y="161" font-size="20" font-weight="bold">LED</text><path d="M652 155 H722 V315 H246 V265 H216" fill="none" stroke="#334155" stroke-width="5"/>
<text x="550" y="213" font-size="16">A (+)</text><text x="648" y="213" font-size="16">K (−)</text><text x="547" y="239" font-size="14">Long leg*</text><text x="646" y="239" font-size="14">Flat edge*</text><text x="230" y="284" font-size="22">−</text>
<text x="30" y="352" font-size="17">Example: (4.5 V − 2.0 V) / 330 Ω = 7.6 mA · resistor ≈ 0.019 W</text><text x="30" y="380" font-size="14">*Polarity clues may be missing on salvaged LEDs. Verify. Never connect the LED directly to the battery.</text></g></svg>
