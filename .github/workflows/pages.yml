name: Publish 3D Vision website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-validation-results
          path: test-results/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The tested dist artifact is the website source. Pages is enabled.
      # GITHUB_TOKEN cannot activate Pages; never put a personal token in source.
      - name: Configure enabled GitHub Pages site
        uses: actions/configure-pages@v5
      - name: Check for competing branch publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publishing_mode=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')
          echo "Pages publishing mode: ${publishing_mode}"
          if [ "${publishing_mode}" != "workflow" ]; then
            echo "::warning::Pages still uses branch publishing. Set Settings > Pages > Source to GitHub Actions to prevent raw source overwriting the tested build."
          fi
      - name: Deploy tested static build
        id: deployment
        uses: actions/deploy-pages@v4
