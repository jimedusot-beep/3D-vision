name: Publish 3D Vision website
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'library.html'
      - 'legacy.html'
      - 'package*.json'
      - 'vite.config.js'
      - 'scripts/**'
      - 'tests/**'
      - 'models/**'
      - 'HERBIE_V1/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-validation-results
          path: test-results/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # One-time prerequisite: Settings > Pages > Source = GitHub Actions.
      # GITHUB_TOKEN cannot activate Pages; never put a personal token in source.
      - name: Configure enabled GitHub Pages site
        uses: actions/configure-pages@v5
      - name: Deploy tested static build
        id: deployment
        uses: actions/deploy-pages@v4
