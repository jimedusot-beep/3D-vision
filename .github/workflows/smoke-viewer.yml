name: Test 3D Vision workshop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'library.html'
      - 'legacy.html'
      - 'package*.json'
      - 'vite.config.js'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/smoke-viewer.yml'
  pull_request:
concurrency:
  group: workshop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Geometry, topology and all 18 STL tests
        run: npm test
      - name: Build portable static site and discover repository assets
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium
      - name: Model manipulation, persistence, exports and mobile browser tests
        run: npm run test:browser
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: SLP anatomy desktop and touch interaction
        run: node tests/anatomy-browser.mjs
      - name: Cross-device account storage and recovery workflows
        run: npm run test:cloud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-test-results
          path: test-results/
          if-no-files-found: ignore
  webkit-mobile:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - name: WebKit model load, manipulation, save/reopen and export
        run: node tests/webkit.mjs && BROWSER_ENGINE=webkit node tests/advanced-browser.mjs
      - name: SLP anatomy iPhone WebKit interaction
        run: BROWSER_ENGINE=webkit node tests/anatomy-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-mobile-results
          path: test-results/
