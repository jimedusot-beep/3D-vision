name: Test 3D Vision workshop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'library.html'
      - 'legacy.html'
      - 'package*.json'
      - 'vite.config.js'
      - 'scripts/**'
      - 'tests/**'
      - 'ANATOMY/**'
      - '.github/workflows/smoke-viewer.yml'
  pull_request:
concurrency:
  group: workshop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Geometry, topology and all 18 STL tests
        run: npm test
      - name: Build portable static site and discover repository assets
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium
      - name: Model manipulation, persistence, exports and mobile browser tests
        run: npm run test:browser
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: SLP anatomy desktop and touch interaction
        run: node tests/anatomy-browser.mjs
      - name: SLP systems and respiratory iPhone study
        run: node tests/slp-systems-browser.mjs
      - name: iPhone field-review checklist, no-upload report and 200% text
        run: node tests/slp-iphone-review-browser.mjs
      - name: Licensed 3D lungs/airway browser study and mobile anatomy
        run: node tests/slp-lungs-browser.mjs
      - name: Pinned 3D diaphragm source, mobile study and accessibility fallback
        run: node tests/slp-diaphragm-browser.mjs
      - name: Recover actual failed source-model downloads with Retry 3D
        run: node tests/slp-retry-browser.mjs
      - name: Z-Anatomy oral structure identification and mobile study
        run: node tests/slp-oral-browser.mjs
      - name: Pinned BodyParts3D 4.3 pharynx, soft-palate and source-model mobile study
        run: node tests/slp-pharynx-browser.mjs
      - name: Z-Anatomy right-ear source verification and hearing guide on iPhone Chromium
        run: node tests/slp-ear-browser.mjs
      - name: Pinned cranial nerve and brainstem Draco mesh source on Chromium
        run: node tests/slp-neural-browser.mjs
      - name: Cross-device account storage and recovery workflows
        run: npm run test:cloud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-test-results
          path: test-results/
          if-no-files-found: ignore
  anatomy-iphone:
    # Isolate anatomy changes from unrelated CAD animation timing failures.
    # This does not replace or weaken the existing WebKit workshop gate.
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - name: Anatomy concept map, sourced notes and iPhone touch journey
        run: BROWSER_ENGINE=webkit node tests/anatomy-browser.mjs
      - name: SLP systems and respiratory iPhone Safari coverage
        run: BROWSER_ENGINE=webkit node tests/slp-systems-browser.mjs
      - name: iPhone WebKit private review, navigation persistence and 200% text
        run: BROWSER_ENGINE=webkit node tests/slp-iphone-review-browser.mjs
      - name: Licensed lung/airway model on iPhone WebKit
        run: BROWSER_ENGINE=webkit node tests/slp-lungs-browser.mjs
      - name: Pinned diaphragm 3D on iPhone WebKit
        run: BROWSER_ENGINE=webkit node tests/slp-diaphragm-browser.mjs
      - name: Recover licensed 3D in iPhone WebKit after a transient network failure
        run: BROWSER_ENGINE=webkit node tests/slp-retry-browser.mjs
      - name: Z-Anatomy oral structures on iPhone WebKit
        run: BROWSER_ENGINE=webkit node tests/slp-oral-browser.mjs
      - name: Pharynx and soft palate source anatomy on iPhone WebKit
        run: BROWSER_ENGINE=webkit node tests/slp-pharynx-browser.mjs
      - name: Pinned right-ear anatomy and hearing journey on iPhone WebKit
        run: BROWSER_ENGINE=webkit node tests/slp-ear-browser.mjs
      - name: Cranial nerves and brainstem with local Draco on iPhone WebKit
        run: BROWSER_ENGINE=webkit node tests/slp-neural-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-iphone-results
          path: test-results/
          if-no-files-found: ignore
  webkit-mobile:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - name: WebKit model load, manipulation, save/reopen and export
        run: node tests/webkit.mjs && BROWSER_ENGINE=webkit node tests/advanced-browser.mjs
      - name: SLP anatomy iPhone WebKit interaction
        run: BROWSER_ENGINE=webkit node tests/anatomy-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-mobile-results
          path: test-results/
