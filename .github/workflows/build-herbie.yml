name: Generate H.E.R.B.I.E. V1 models and documentation
on:
  workflow_dispatch:
  push:
    paths:
      - 'HERBIE_V1/CAD/**'
      - 'HERBIE_V1/PARTS.csv'
      - 'scripts/generate_herbie.py'
      - 'scripts/build_docs.py'
      - '.github/workflows/build-herbie.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Install Python libraries
        run: python -m pip install numpy trimesh pygltflib reportlab matplotlib
      - name: Generate and verify 18 STL parts and two GLBs
        run: python scripts/generate_herbie.py
      - name: Generate dimension references and visual previews
        run: python scripts/build_docs.py
      - name: Commit regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HERBIE_V1/STL models HERBIE_V1/documents
          if git diff --cached --quiet; then
            echo "No generated changes to publish"
            exit 0
          fi
          git commit -m "Refresh H.E.R.B.I.E. models, drawing PDFs and archives"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Generated assets committed successfully"
              exit 0
            fi
            echo "Branch advanced during generation; retrying in 2 seconds"
            sleep 2
          done
          echo "Could not publish generated files after retries" >&2
          exit 1
