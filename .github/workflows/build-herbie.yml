name: Generate H.E.R.B.I.E. V1 STL and GLB models
on:
  workflow_dispatch:
  push:
    paths:
      - 'HERBIE_V1/CAD/**'
      - 'scripts/generate_herbie.py'
      - '.github/workflows/build-herbie.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Install Python model libraries
        run: python -m pip install numpy trimesh pygltflib
      - name: Generate and verify all 18 STL parts and GLBs
        run: python scripts/generate_herbie.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HERBIE_V1/STL models
          git diff --cached --quiet || (git commit -m "Generate 18 H.E.R.B.I.E. STLs and 2 interactive GLBs" && git push)
