name: Generate H.E.R.B.I.E. V1 models and documentation
on:
  workflow_dispatch:
  push:
    paths:
      - 'HERBIE_V1/CAD/**'
      - 'HERBIE_V1/PARTS.csv'
      - 'scripts/generate_herbie.py'
      - 'scripts/build_docs.py'
      - '.github/workflows/build-herbie.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Install Python libraries
        run: python -m pip install numpy trimesh pygltflib reportlab matplotlib
      - name: Generate and verify 18 STL parts and two GLBs
        run: python scripts/generate_herbie.py
      - name: Generate dimension references and visual previews
        run: python scripts/build_docs.py
      - name: Commit regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HERBIE_V1/STL models HERBIE_V1/documents
          git diff --cached --quiet || (git commit -m "Refresh H.E.R.B.I.E. models, drawing PDFs and archives" && git push)
